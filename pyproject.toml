[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mrilab"
version = "0.1.0"
description = "Backend of the Model MRI: frozen LLM measurement instruments, reference surfaces, and evidence-disciplined reports over one engine."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    # service side only — torch et al. live in the research venv (see runtime_lock.json)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.21",
    "huey>=2.5",
    "typer>=0.12",
    "jinja2>=3.1",
    "numpy>=2.0",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-regressions>=2.5",
    "httpx>=0.27",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
mrilab = "mrilab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mrilab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu and not network and not golden' -q"
markers = [
    "gpu: needs the RTX 3090 + research venv (run explicitly: pytest -m gpu)",
    "network: downloads from HF hub or elsewhere",
    "golden: golden-row reproduction lane (usually also gpu); required before release or claims changes",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/mrilab/instruments", "src/mrilab/datasets", "src/mrilab/inspector"]
# ^ vendored frozen instruments keep their upstream style; behavioral edits are forbidden,
#   so style churn there is pure diff noise against the provenance sha256.

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = "src/mrilab/(instruments|datasets|inspector)/"
