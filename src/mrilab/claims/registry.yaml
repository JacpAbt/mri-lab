# ------------------------------------------------------------------ clocks --
- id: two-clocks
  statement: >-
    The machine has two independent time variables: structure forms on the
    DATA clock (absolute tokens; window onset ~1-5B regardless of budget or
    scale) and coordinates/curvature move on the SCHEDULE clock (LR x steps;
    weights and directions freeze under the anneal).
  evidence_class: measured
  status: LIVE
  n: >-
    structure clock: 5 models, 3 scales, 3 architecture classes, blind-tested
    at 32B (onset HIT dead center); schedule clock: weights 30x and directions
    14x decline across the OLMo-2-1B stage2 anneal; 32B aligns at matched
    training fraction; one causal data point (steward arms, §26)
  bounds: >-
    The boundary-jump half of §18 is confounded (LR re-warm co-varies with a
    mix switch); the verdict rests on the within-anneal decline at constant
    mix. Onset transports; transition WIDTH and completion LEVEL are
    family/scale facts (32B PARTIAL, Hubble completion MISS).
  source: "BLUEPRINT_2026_08.md §18/§18b/§21/§26; §42a L2"
  verbatim_verified: true
  tags: [clocks, pretraining]

- id: window-descriptive-only
  statement: >-
    The developmental window (~1-20B absolute tokens) describes what a model
    builds BY ITSELF; it is NOT when the model is teachable. Every causal test
    of window-timed intervention failed (retention, gate-vs-tilt, rule-vs-item,
    dial) — spontaneous formation is early, effective intervention is late.
  evidence_class: measured
  status: LIVE
  n: "0-for-4 causal tests at 160M toy scale (§26/§29/§31/§29b); descriptive window: 5 models, 3 scales"
  bounds: >-
    Toy scale (160M), constructed lexical anchor, ~16M-token injections at the
    window's EDGE (not traversal); a traversal-scale test needs ~100x tokens.
    The descriptive timing law is untouched. MUST NOT be quoted: "the window
    is when to intervene" in any form (TRACK_B quoting rules).
  source: "BLUEPRINT_2026_08.md §4/§26/§29/§31/§29b; TRACK_B_HANDOFF.md update 2026-08-24"
  verbatim_verified: true
  tags: [window, curriculum]

- id: norm-clock
  statement: >-
    ||W||^2/N grows on the data clock at constant LR and relaxes with LR late:
    the weight-norm face of the ABS/REL split is itself schedule-structured,
    and the stage2 decomposition closes multiplicatively.
  evidence_class: measured
  status: LIVE
  n: "28 stored Cell L rows + OLMo stage1/stage2 revisions (zero new compute); stage2 closure 1.40 x 0.94 = 1.31 vs measured S_wt factor"
  bounds: "Two families; descriptive regression over stored rows, no intervention."
  source: "PANEL_PREREG_2026_08.md norm-clock block (scored 2026-08-26)"
  verbatim_verified: false
  tags: [clocks, norms]

# --------------------------------------------------------------- readiness --
- id: readiness-by-inference
  statement: >-
    Readiness — whether a substrate converts taught examples into a RULE or
    into ITEMS — is measurable by pure inference (k demonstrations in context,
    unseen family members held out), with no forks and no gradients, and
    agrees with the training channel within a factor of 2 at matched
    capability.
  evidence_class: measured
  status: LIVE
  n: "channel agreement 1.5-1.8x at the primary dose (CELL J P-J3); surface: 22 points, 5 sizes, 2 families"
  bounds: >-
    One anchor family originally (dialect); the law now rests on five payload
    classes plus an arbitrary-lookup null that never fires (24/25 CIs span
    zero, 70M-9B). The k=4 column ran hotter (2.25x) and is the recorded miss.
  source: "BLUEPRINT_2026_08.md §37/§38; status addendum 2026-08-31"
  scope_guards: [readiness_naive_substrate]
  verbatim_verified: true
  tags: [readiness, instrument]

- id: readiness-crossing
  statement: >-
    The item-to-rule crossing sits between held-out loss ~5.5 and ~4.7 in
    every family measured; above it taught rules land as items and
    anti-generalize, below it they land as rules. The crossing is
    payload-independent on form familiarity.
  evidence_class: measured
  status: LIVE
  n: >-
    22-point surface (5 sizes, 2 families); five payload classes + null;
    form-familiarity: 4-rung ladder, Spearman(NLL,C*)=0.000 with a LEVEL cliff
    only at the orthographic extreme (O-PRIME); replicated INSIDE one
    traversing run (DEMO-CL P-CL2: -0.80 -> -0.01 -> +0.21 by placement)
  bounds: >-
    Collapse onto loss is approximate: a 2.1-2.6x band remains at matched loss,
    tracking maturity within family. The crossing is PAYLOAD-CLASS-DEPENDENT in
    location: safety/Choice payloads cross ~1.1 nats LATER than the neutral
    rule (Cell Q, 2026-09-01 — see safety-readiness-gated); a graded
    semantic-depth ladder (O-double-prime) is frozen to separate pragmatic vs
    representational depth. Verdicts only where the CI clears zero; the 70m
    corner (300B tokens, unseen ~0) is the documented boundary case: maturity
    cannot substitute for capability.
  source: "BLUEPRINT_2026_08.md §38/§41 edge 3; PANEL_PREREG O-PRIME + DEMO-CL + CELL Q blocks"
  scope_guards: [readiness_naive_substrate, g_ratio_display]
  verbatim_verified: true
  tags: [readiness, crossing]

- id: unseen-gain-primary
  statement: >-
    The readiness gauge reports UNSEEN GAIN IN NATS as primary and the ratio G
    as secondary: the ratio's denominator makes points erratic where seen
    gains are large, and G is not reported near the crossing at all
    (denominator blowups).
  evidence_class: measured
  status: LIVE
  n: "Spearman vs loss: unseen gain -0.88 vs G -0.84 across the 22-point surface; G formally corrected in L-ter (22/22)"
  bounds: "Instrument-form statement; inherits the G1 floor gate (seen gain > 1.0 nats, CI clear)."
  source: "BLUEPRINT_2026_08.md §37(i)/§38b; L-ter correction (campaign record 2026-08-26)"
  scope_guards: [g_ratio_display]
  verbatim_verified: true
  tags: [readiness, instrument]

- id: maturity-residual
  statement: >-
    At matched capability, more training still buys measurably more
    abstraction and more gate-like writes — roughly a factor of 2 — and
    capability carries the rest, including the sign flip.
  evidence_class: measured
  status: LIVE
  n: "2.1x on the rule index (CELL F), 1.75x on gatedness (CELL I), reproduced by a third method on the surface (§38a-iii within-family pairs)"
  bounds: >-
    Capability matched on held-out C4 loss only (a single scalar); the
    ICL-matched control is the named open confound. One causal family
    (pythia), one lexical anchor.
  source: "BLUEPRINT_2026_08.md §32/§33/§38a-iii"
  verbatim_verified: true
  tags: [readiness, maturity]

- id: early-writes-anti-generalize
  statement: >-
    Below the crossing, dose does not buy the rule — it buys
    anti-generalization: tripling the dose increased item learning while
    driving unseen-member gain NEGATIVE with a CI clear of zero.
  evidence_class: measured
  status: LIVE
  n: "dose 0.30 arm: unseen -1.98 [-2.40,-1.58] (CELL G, 160M); same signature with NO weight updates in the context channel (§37-ii); within-run replication at the early switch (DEMO-CL)"
  bounds: "One anchor, one family; partially relaxes over retention (-1.98 -> -0.51 over 1000 steps)."
  source: "BLUEPRINT_2026_08.md §31b/§35/§37"
  verbatim_verified: true
  tags: [readiness, curriculum]

- id: placement-decides-fate-not-persistence
  statement: >-
    Placement decides what a write BECOMES (rule vs items); it does not — at
    the scale tested — decide whether it SURVIVES continued training.
    Fate and persistence are different quantities; steward-style designs must
    aim at fate.
  evidence_class: measured
  status: LIVE
  n: "persistence: retention 0.873 vs 0.906 at matched dose/schedule (P2 KILL, §26); fate: G by placement -0.80 -> +0.21 inside one run (P-CL2)"
  bounds: "Persistence kill is toy-scale (160M, window-edge injection); fate-vs-persistence at traversal scale is dark edge D2."
  source: "BLUEPRINT_2026_08.md §41 (the reconciliation), §26 vs §31b/DEMO-CL"
  verbatim_verified: true
  tags: [curriculum, strata]

- id: item-channel-decays
  statement: >-
    The two ICL channels dissociate developmentally: in-context ITEM learning
    of arbitrary associations falls with capability while the RULE channel
    rises.
  evidence_class: measured
  status: LIVE
  n: "n=2 anchors (seen-side decay +5.71 -> +1.41 across the ladder)"
  bounds: "Two anchors, inference channel only."
  source: "PANEL_PREREG_2026_08.md L1-TER v1 byproduct (b), scored 2026-08-28"
  verbatim_verified: false
  tags: [readiness]

- id: readiness-null-calibration
  statement: >-
    The readiness gauge does not hallucinate generalization: a payload with no
    inferable rule reads ~0 unseen gain across the full substrate range while
    the dialect rule reads +5.0-5.4.
  evidence_class: measured
  status: LIVE
  n: "24/25 CIs span zero across 70M-9B (unplanned null calibration, L1-TER v1)"
  bounds: "Null payload was a no-inferable-rule word list; one construction."
  source: "PANEL_PREREG_2026_08.md L1-TER v1 byproduct (a)"
  verbatim_verified: false
  tags: [readiness, instrument, null-calibration]

- id: safety-readiness-gated
  statement: >-
    Safety (Choice) payloads obey the readiness law through the context
    channel — and with structure: harm and deception rules each install as
    RULES (unseen gain > +0.2, CI clear, 8 crossing checkpoints per
    construct), safety crosses ~1.1 nats LATER than the neutral dialect rule
    (loss ~3.46 vs 4.60 — "place safety after the GENERAL crossing" is
    insufficient; it needs the SAFETY crossing), and at maturity the policy
    transfers across constructs (harm-prefix -> deception-unseen +2.87, 3/3
    CI-clear; reverse +4.25, 3/3) — safety is ONE object across these two
    constructs, unlike the construct-bound truth readout.
  evidence_class: measured
  status: LIVE
  n: >-
    21 checkpoints, 70M-9B, 5 families, 2 constructs + the arbitrary-label
    null (G-Q0: CI spans 0 at all 21 checkpoints); effective n=24 unseen /
    16 seen per set
  bounds: >-
    IN-CONTEXT CHANNEL ONLY (rule expression, not a gradient write — Cell
    Q-bis is the gradient install, and Cell C VOIDed a 160M gradient security
    install, so the channels may differ). The crossing REGION is noisy at
    n=24; the ROBUST claim is the ~1.1-nat gap and the 8/8 CI-clear mature
    crossings, NOT the exact crossing loss. The cross-construct transfer may
    run through a shallow "sounds bad -> refuse" route (named in the prereg).
    Synthetic schematic stimuli, base (not deployed) models. 32B frontier
    stage pending on Modal. A hit licenses "safety rules are in-context
    installable and readiness-gated at these scales", not "aligned behaviour
    is guaranteed".
  source: "PANEL_PREREG_2026_08.md CELL Q scored block (2026-09-01 10:05)"
  scope_guards: [readiness_naive_substrate]
  verbatim_verified: true
  tags: [readiness, safety, alignment]

# ------------------------------------------------------------ write economy --
- id: exchange-table
  statement: >-
    The three write channels are priced and the price/persistence inversion is
    exact: context buys ~0.23 nats/token and persists zero tokens past the
    window; training buys ~1.4e-5 nats/token and retains ~90% over a
    1000-step continuation; steering buys ~80 nats per unit relative norm,
    runtime-only, in a linear regime ending near alpha 0.25.
  evidence_class: measured
  status: LIVE
  n: "one disposition (constructed lexical rule), one model per column, one margin instrument; steering: 4 doses"
  bounds: >-
    The context row is content-matched, not token-matched; prices are margin
    nats (an internal currency) until the margin->behaviour bridge runs; every
    number <=1.4B params — treat ratios as order-of-magnitude claims, not
    constants of nature.
  source: "BLUEPRINT_2026_08.md §28 + CELL E; SATELLITE_CONTROL_ECONOMICS.md §2/§6"
  verbatim_verified: true
  tags: [economics, channels]

- id: attacker-defender-asymmetry
  statement: >-
    Defenders buy durable behaviour at training prices; attackers rent
    behaviour at context prices, ~10^4 cheaper per token — a structural
    asymmetry that argues for input-side and monitoring defences on economic
    grounds.
  evidence_class: measured
  status: LIVE
  n: "derived from the exchange table (one disposition, one family)"
  bounds: >-
    Order-of-magnitude claim. Falsifiers (recorded): a second disposition
    pricing context within ~10x of training; context gains persisting beyond
    the window; training reaching context-like per-token rates at scale.
  source: "SATELLITE_CONTROL_ECONOMICS.md §3/§7"
  verbatim_verified: true
  tags: [economics, security]

- id: rising-susceptibility
  statement: >-
    A fixed-norm activation push buys 8-25x more behaviour change late in
    pretraining than early (in per-checkpoint margin-SD units): the steering
    channel gets cheaper as the model trains.
  evidence_class: measured
  status: LIVE
  n: "3/3 dispositions, OLMo-2-1B family, 5 revisions; survives margin-SD normalization"
  bounds: >-
    IN-FAMILY ONLY: the one out-of-family attempt (Hubble, 100B budget) could
    not reach the token regime where the effect appears and is recorded as a
    miss — never present without this caveat (TRACK_B rule).
  source: "BLUEPRINT_2026_08.md §16c/§30 B6-ii; TRACK_B_HANDOFF.md"
  verbatim_verified: true
  tags: [steering, economics]

- id: multiplicative-transfer-law
  statement: >-
    A frozen intervention's effect over training reconstructs as
    overlap(t) x gain(t): coordinate overlap decays while in-subspace gain
    grows 7-9x, and the product stays order-one across 190x tokens. Effects
    are products; single-factor decay laws fit half the phenomenon.
  evidence_class: measured
  status: LIVE
  n: "near-exact reconstruction in 15/15 revision-cells, 3 sources (write_object cells)"
  bounds: "One family (OLMo-2-1B), one layer; out-of-family transport untested."
  source: "BLUEPRINT_2026_08.md §16d/§36c"
  verbatim_verified: true
  tags: [steering, theory]

- id: re-dose-not-re-fit
  statement: >-
    Steering vectors expire by DOSE, not by direction: the small-alpha
    response never inverts; an early-calibrated dose overshoots the late
    model's narrower linear regime. Practical form: re-dose, don't re-fit.
  evidence_class: measured
  status: LIVE
  n: "5 revisions x 3 dispositions (§16d P-A); linear regime ends near alpha 0.25 (CELL E)"
  bounds: >-
    The engineering variant "store control in token space" is WITHDRAWN
    (killed 0.60x vs >=1.5x required, §16e) — this dose law is the pair's only
    surviving practical recommendation.
  source: "BLUEPRINT_2026_08.md §16d/§16e/§28-CELL-E"
  verbatim_verified: true
  tags: [steering, practice]

# ----------------------------------------------------- sharpness / fragility --
- id: anneal-freezes-coordinates-not-curvature
  statement: >-
    The final anneal freezes coordinates but not curvature: rotation falls
    ~14x while isotropic curvature climbs monotonically through the same
    revisions, with the growth rate peaking mid-anneal.
  evidence_class: measured
  status: LIVE
  n: "same 5 stage2 revisions (rotation) + P-L4 6/6 monotone (curvature)"
  bounds: "One family's anneal (OLMo-2-1B stage2); ABS/REL conventions measure different physics — the claim is the ABS (tr H) face."
  source: "BLUEPRINT_2026_08.md §21 + status addendum (P-L4); INSTRUMENT_PREREG L-W battery"
  verbatim_verified: true
  tags: [anneal, sharpness]

- id: quenched-endpoint
  statement: >-
    The annealed endpoint is OUT-OF-EQUILIBRIUM sharp (the anneal outruns
    equilibration): 500 steps / 8.2M fresh tokens at 3e-5 HALVE its isotropic
    curvature at +0.001 nats of held-out C4, flattening monotone in LR and
    working below the schedule floor, while the same recipe leaves a mid-run
    checkpoint unchanged.
  evidence_class: measured
  status: LIVE
  n: "CELL Z HIT x2; n=1 substrate (pythia-160m endpoint); mid-run control = X fresh arm"
  bounds: >-
    The +0.001 cost is C4-SCOPED ONLY: the re-warm redistributed +0.44 nats of
    code at exactly matched C4 (Z-bis) — any capability gate must name its
    measurement domain. The repair is durable (EQ: survives a 100-step probe)
    and changes NOTHING a fine-tuner can measure (matched-LR damage identical).
  source: "PANEL_PREREG_2026_08.md CELL Z + Z-BIS + EQ scored blocks"
  verbatim_verified: false
  tags: [anneal, rejuvenation]

- id: rejuvenate-before-quantize
  statement: >-
    Rejuvenation's payoff is the quantization channel: a brief fresh-data
    re-warm of an over-annealed release halved int4 RTN damage (0.832 ->
    0.352 vs a 0.60 bar) at ~0.003% of pretraining cost, with the ordering
    matching dL_abs near-proportionally.
  evidence_class: measured
  status: LIVE
  n: "n=1 pair (parent vs rejuvenated artifact) + control; RTN-simulated int4"
  bounds: >-
    RTN-SIMULATED only — nf4/GPTQ deployment-grade validation is queued
    (Z-ter-b v2) and gates any stronger wording. Nearest neighbour: QAH
    (2608.20953) heals by distillation; ours differs (plain re-warm, costed,
    sensor-priced) and dies if the pricing fails on a second family.
  source: "PANEL_PREREG_2026_08.md Z-TER scored block; CONTROL_2026_08.md C5"
  scope_guards: [dl_abs_channel_guard]
  verbatim_verified: false
  tags: [quantization, recipe]

- id: dl-abs-prices-int4
  statement: >-
    dL_abs (isotropic curvature) prices int4 RTN damage: damage is strictly
    ordered by dL_abs across all measured artifacts, including under
    intervention (the rejuvenated artifact).
  evidence_class: measured
  status: LIVE
  n: "6/6 monotone across 2 families (pythia set + OLMo Z-TER-B v1 3/3)"
  bounds: >-
    RTN-simulated; per-output-channel symmetric quantization on the
    sensitivity parameter set; deployment-grade nf4/GPTQ queued. The gauge
    prices the weight-grid/random channel ONLY — it does not price the
    gradient channel (see no-static-gauge-predicts-training).
  source: "PANEL_PREREG_2026_08.md Z-TER / Z-TER-B v1 scored blocks"
  scope_guards: [dl_abs_channel_guard]
  verbatim_verified: false
  tags: [quantization, sharpness]

- id: anneal-costs-int4-fragility
  statement: >-
    OLMo's own stage2 anneal costs 1.44x int4 fragility at matched capability
    — the quantization price of annealing, measured on a released trajectory.
  evidence_class: measured
  status: LIVE
  n: "n=1 trajectory (OLMo-2-1B; base C4 2.7792 vs 2.7841)"
  bounds: "One family, RTN-simulated, matched-capability pair from released revisions."
  source: "PANEL_PREREG_2026_08.md Z-TER-B v1 free datapoint"
  scope_guards: [dl_abs_channel_guard]
  verbatim_verified: false
