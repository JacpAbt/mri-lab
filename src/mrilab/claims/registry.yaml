- id: no-static-gauge-predicts-training
  statement: >-
    No static gauge measured so far prices what a training trajectory will do
    at matched LR — killed four independent ways — because gain is
    non-monotone in horizon while damage accumulates. Trajectory outcomes must
    be measured by trajectories, at the horizon of interest.
  evidence_class: measured
  status: LIVE
  n: "four independent kills: CELL W (x2), Z-bis, EQ, DP v1.1; plus U2-ter (horizon flip at 1.4b)"
  bounds: >-
    "So far" = every static face built by the program (dL_abs, S_wt, S_grad,
    S_x; best static correlate: curv_x got the coarse damaged/benign split at
    19.8x for a 68x gap). Standing prediction AGAINST the pre-hoc fine-tuning
    prediction subfield as currently posed (§42d); scale-bounded to what we
    can test.
  source: "BLUEPRINT_2026_08.md §41 edge 4 / §42a L4 / §42d; PANEL scored blocks W/Z-bis/EQ/DP"
  verbatim_verified: true
  tags: [law, fine-tuning, negative]

- id: crash-test-ranks
  statement: >-
    The 100-step crash test (one short fine-tune at a declared reference LR,
    reading damage, gain, and target_base) is the panel's ground-truth
    fine-tuning-fragility instrument: its 100-step short form rank-agrees with
    the 200-step outcome and separates corpora reproducibly across scale.
    It RANKS; it never extrapolates.
  evidence_class: measured
  status: LIVE
  n: "Spearman +0.976 (damage) / +0.991 (gain) vs 200-step over n=22 stored arms; corpus separation reproduced across a 3.4x parameter gap"
  bounds: >-
    Ranking only, at the probe's own horizon and reference LR; damage measured
    in held-out nats, not task accuracy. ~4 min at 160m / 13 min at 1.4b per
    100-step arm on the reference GPU.
  source: "PANEL_PREREG_2026_08.md crash-test protocol v1 (frozen 2026-08-27) + DP blocks"
  scope_guards: [horizon_match]
  verbatim_verified: false
  tags: [crash-test, instrument]

- id: probe-at-your-horizon
  statement: >-
    Three crash probes at the horizon you intend to train select the
    fine-tuning LR at grid-optimum quality for ~30-60% of grid cost — but a
    probe licenses ONLY its own horizon: gain rank flips between 100 and 200
    steps (damage accumulates; gain peaks).
  evidence_class: measured
  status: LIVE
  n: >-
    horizon-matched selection regret 0.0000 at both 410m and 1.4b (from stored
    grids); across-horizon transport KILLED at 1.4b (regret 0.0291 vs 0.020
    bar); earlier exact hits 3/4 checkpoints at the 100-step horizon
  bounds: >-
    CIRCULARITY CAVEAT recorded: in the stored-grid check the optimum lay
    inside the probe triplet; one GPU cell on a new domain (U2-quater) closes
    it and gates any stronger wording. Selection is 2-D by construction:
    damage cap AND gain rank (gain is non-monotone in LR).
  source: "PANEL_PREREG_2026_08.md U2/U2-bis/U2-ter/U2-quater-look blocks"
  scope_guards: [horizon_match]
  verbatim_verified: false
  tags: [crash-test, preflight, lr]

- id: curvature-provenance
  statement: >-
    Curvature's meaning depends on its provenance: warmup-sharp checkpoints
    are benign (negative damage at small LR, more gain per damage) while
    anneal-sharp checkpoints are brittle. A 12x dL_abs gap bought only a 1.79x
    difference in usable LR — the iso-damage rule is dead as a dL_abs-only law.
  evidence_class: measured
  status: LIVE
  n: "CELL W MISS x2 (ratio 1.79x vs pre-registered band [4.0, 36.1]); U-prime held anneal-sharp-vs-mid only (1 pair)"
  bounds: "One family/size pair per provenance; the vitals advisory that used the iso-damage rule is WITHDRAWN."
  source: "PANEL_PREREG_2026_08.md CELL W scored block + synthesis"
  verbatim_verified: false
  tags: [sharpness, fine-tuning]

- id: local-geometry-vs-equilibrium
  statement: >-
    Local sharpness and matched-LR damage are INDEPENDENT quantities: damage
    histories re-equilibrate in ~100 steps and then run at the substrate's own
    rate; an artificial repair moves every static gauge while damage stays
    identical, and the repair itself survives the probe. Static gauges read
    LOCAL GEOMETRY (schedule-clocked, repairable); damage answers to
    EQUILIBRIUM BEHAVIOUR (a substrate property).
  evidence_class: measured
  status: LIVE
  n: "CELL SX + CELL EQ (P-EQ1 kill against the program's own mechanism; rejuv ends 1.07 vs parent 1.94 local sharpness at identical damage); n=5 artifacts"
  bounds: "One family; correlated across natural checkpoints, dissociated under artificial repair — the dissociation is the claim."
  source: "PANEL_PREREG_2026_08.md SX + EQ scored blocks (2026-08-27)"
  verbatim_verified: false
  tags: [sharpness, theory]

- id: sgrad-regime-flag
  statement: >-
    Directional (gradient-face) probes need ~300x smaller rho than random ones
    (rho_dir 3e-4 vs 0.10); anisotropy numbers taken at rho=0.10 are
    saturation artifacts. In the clean regime, anisotropy is ~3e4 and
    training-invariant within 2x, and the gradient face follows the same
    schedule-clock U-shape.
  evidence_class: measured
  status: LIVE
  n: "SG-SURFACE 15/15 valid-regime points; two voided attempts at rho 0.10/0.01 caught by G-SX1"
  bounds: "P-PAN3's 170x->15x anisotropy trajectory is formally SUPERSEDED (saturation artifact); Z-BIS-B was retracted on the same grounds."
  source: "PANEL_PREREG_2026_08.md SG-SURFACE block; SX amendment 1"
