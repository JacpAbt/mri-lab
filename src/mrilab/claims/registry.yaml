  statement: >-
    The onset of zero-sum fine-tuning (where "damage" starts to exist) is
    CURVATURE-driven, not alignment-driven: cross-domain first-order stays in
    the everything-helps regime to 300B tokens while directional curvature
    explodes at the endpoints.
