- id: epoch-safety
  statement: >-
    At small scale, ~2 epochs of pool reuse is safe on both axes (no hidden
    sharpening at the capability-preserving dose; at 4 epochs the loss already
    sees it) — repetition is not a hidden-fragility dial at this scale.
  evidence_class: measured
  status: LIVE
  n: "X-bis: 1.05x sharpening (inside noise) at 2 epochs, n=1 substrate/recipe; the 64-epoch arm detonated capability (+2.24 nats, G-X2 void)"
  bounds: "Small-model recipe result (pythia-160m mid-run); the pythia endpoint spike remains unattributed."
  source: "PANEL_PREREG_2026_08.md CELL X / X-BIS scored blocks"
  verbatim_verified: false
  tags: [epochs, recipe]

- id: kd-regulariser
  statement: >-
    Pure knowledge distillation is a powerful regulariser against small-pool
    overfitting: at matched everything, CE lost 1.29-1.77 nats of held-out
    capability while KD stayed flat or improved — 15-35x less damage. And pure
    KD is NET HARMFUL when the teacher leads by only ~0.4 nats: there is a
    teacher-student gap threshold.
  evidence_class: measured
  status: LIVE
  n: "3 substrates, 2 teacher sizes, ONE pool size / epoch count / family (KD v2 byproduct); gap threshold: single cell"
  bounds: >-
    n=1 configuration — named CELL KD-REG for its own prereg before any
    stronger claim; the mimicry-vs-advantage design tension means the two KD
    clauses cannot share a cell (v3a/v3b split).
  source: "PANEL_PREREG_2026_08.md KD v2 scored block (2026-08-31)"
  verbatim_verified: false
  tags: [distillation, recipe]

# -------------------------------------------------------- post-training/read --
- id: sft-double-ratchet
  statement: >-
    Post-training operates two one-way ratchets measured by different
    instruments: GLOBAL curvature jumps 2-3x at SFT and never re-softens
    through DPO/Instruct (both families), while per-disposition stiffness is
    recipe-dependent (OLMo hardens up to 95x at SFT; SmolLM3 softens 0/4) —
    stiffness and curvature are two different objects.
  evidence_class: measured
  status: LIVE
  n: "CELL AA (2 families for the curvature jump; stiffness: OLMo + SmolLM3 blind test B1)"
  bounds: >-
    "SFT hardens the selector" is an OLMo-2 recipe fact, NOT a law (TRACK_B
    boundary); SmolLM3 3B seed-SD ~10x OLMo's — any 3B clause needs n>=20
    seeds. AA as operationalized was MISS x2; the two-object split is the
    surviving substance.
  source: "PANEL_PREREG_2026_08.md CELL AA scored block; BLUEPRINT §7/§22"
  scope_guards: [three_b_seed_rule]
  verbatim_verified: false
  tags: [post-training, audit]

- id: post-training-readiness-cost
  statement: >-
    Post-training costs readiness: R_unseen falls monotonically through the
    release ladder (5.40 -> 3.85, ~29%) from base to Instruct.
  evidence_class: measured
  status: LIVE
  n: "n=1 family ladder (OLMo-2-1B base/SFT/DPO/Instruct), free column from CELL AA"
  bounds: "One family; the release audit's readiness-cost column, not a law."
  source: "PANEL_PREREG_2026_08.md CELL AA free datapoint"
  scope_guards: [readiness_naive_substrate]
  verbatim_verified: false
  tags: [post-training, audit, readiness]

- id: sycophancy-sft-signature
  statement: >-
    The behavioural signature of imitative post-training transfers across
    families: SFT at least doubles sycophancy on KNOWN facts while honesty
    COHERENCE stays untouched — and pressure-resistance improves under
    pretraining alone (0.19 -> 0.06 across the base trajectory).
  evidence_class: measured
  status: LIVE
  n: "OLMo ladder + SmolLM3 blind test (B2 HIT: 2.15x vs predicted >=1.5x; coherence within +-0.08)"
  bounds: >-
    The DPO-repairs clause did NOT transfer (SmolLM3 final = SFT, recorded
    miss). Reconciliation with Perez/Sharma (sycophancy rises with RLHF) is
    axis/regime-specific: known facts, base-model pressure-resistance.
  source: "BLUEPRINT_2026_08.md §17/§22; TRACK_B blind-tested tier"
  verbatim_verified: true
  tags: [post-training, honesty]

- id: truth-decomposition
  statement: >-
    "Truthfulness" is a portmanteau with no cross-dataset coherence at any
    checkpoint or scale; it decomposes into KNOWLEDGE (distributed, accreting),
    a TRUTH READOUT (a real statement-probe plane, topic-bounded), and HONESTY
    (the choice to assert known facts under pressure — the strongest-cohering
    value object measured). Truth is READ, not chosen-by: probe and preference
    directions are nearly different objects on identical text.
  evidence_class: measured
  status: LIVE
  n: "probe-vs-preference cos 0.22-0.32; honesty coherence 0.49-0.76 raw on ~0.90 ceilings; portmanteau failure reproduced blind on Qwen3.5-9B (corrected -0.011)"
  bounds: >-
    The truth readout is topic-universal only (0.996-1.0 within constructs,
    0.58-0.85 across); the L3 teaching channel is construct-bound the same way
    (sciq->halu installs, sciq->TruthfulQA zero, CELL O). No truthfulness
    benchmark movement is interpretable without this split (§42d).
  source: "BLUEPRINT_2026_08.md §8/§23/§39b; CELL O P-O3/L3"
  verbatim_verified: true
  tags: [objects, truth, eval]

- id: gemma-format-boundary
  statement: >-
    The preference battery is not architecture-neutral: Gemma-3 organizes
    preference directions by INPUT FORMAT (code-shaped sources agree
    regardless of content) where OLMo and Qwen organize by category — and
    Gemma-class outlier-channel domination (top-5 dims carrying up to 0.95 of
    direction norm) destabilizes split-half estimators into impossible
    corrected cosines.
  evidence_class: measured
  status: LIVE
  n: "3 depths x 2 categories (format signal survives de-outliering: 0.51 vs 0.17 background); root cause quantified (top-5 mass 0.21-0.95 vs Qwen 0.05-0.30)"
  bounds: >-
    The raw 0.92 magnitude was outlier-inflated and must not be quoted. Rule:
    top-5 mass > 0.5 or a negative split-half ceiling quarantines the cell
    automatically — quarantined cells render as instrument failure, never as
    findings.
  source: "BLUEPRINT_2026_08.md §25/§27"
  scope_guards: [family_quarantine]
  verbatim_verified: true
  tags: [battery, instrument, quarantine]

- id: format-share-controls
  statement: >-
    Constructed payloads separate category from surface by construction:
    format twins read ~zero format share (median -0.01 across 24 checkpoints)
    where borrowed payloads read ~70% — and the security "semantic transfer"
    headline decomposed as roughly 70% code format.
  evidence_class: measured
  status: LIVE
  n: "P-O2 HIT (24 checkpoints); 39g code control (+0.696 SD off-category vs +0.53 demonstrated)"
  bounds: "Format-pair contrast is mandatory on every battery claim (the §25/§39 lesson, arrived three times)."
  source: "BLUEPRINT_2026_08.md §39f/§39g; PANEL_PREREG CELL O P-O2"
  verbatim_verified: true
  tags: [instrument, controls]

- id: induction-dtype-floor
  statement: >-
    The random-token induction probe is dtype-sensitive near its floor (0.1496
    bf16 vs 0.2722 fp32 on the same checkpoint; identical to 4 decimals where
    the score is high): low readings must carry their dtype.
  evidence_class: measured
  status: LIVE
  n: "one checkpoint pair (the discrepancy), high-score identity across the measured ladders"
  bounds: "Instrument note; the induction clock's onset claims are unaffected (high-score regime)."
  source: "instrument-battery-traps ledger (2026-08); ENVIRONMENT.md dtype notes"
  scope_guards: [dtype_disclosure]
  verbatim_verified: false
  tags: [instrument, clocks]

- id: trigger-discipline
  statement: >-
    Live training triggers need calibration IN-POPULATION plus smoothing and
    hysteresis: a threshold imported from released checkpoints was unreachable
    in a compressed fork, and an n=24 single probe swings +-0.8 on noise
    (would have fired spuriously). The closed-loop claim itself remains
    UNDISCHARGED — no interface may expose a raw single-probe trigger.
  evidence_class: measured
  status: LIVE
  n: "DEMO-CL (G-CL2 failed; P-CL1 not scored; two instrument findings); requirement: k-consecutive readings at n>=96"
  bounds: "The fallback arm's win was a fixed policy, not a decision; DEMO-CL v2 (post-crossing fork or 10x budget, calibrated + smoothed trigger) is the named next test."
  source: "PANEL_PREREG_2026_08.md DEMO-CL scored block (2026-08-28)"
  scope_guards: [trigger_smoothing]
  verbatim_verified: false
  tags: [control, recorder]

- id: transport-calculus
  statement: >-
    Laws, ranks, crossings, and dissociations transport across models;
    directions, thresholds, and absolute levels are family-private. A claim's
    replication probability is read off its tier — which is why this system
    reports ranks and crossings and never extrapolates magnitudes across
    families.
  evidence_class: measured
  status: LIVE
  n: "the program's own scoreboard: 4 families of blind tests (invariants predicted, shapes did not); every panel-week kill was an extrapolated threshold/horizon/population"
  bounds: "Meta-law (L1 corollary); enforced structurally in this backend (rank/crossing language only)."
  source: "BLUEPRINT_2026_08.md §2/§20b/§30/§41 edge 9/§42a L1/§42c U4"
  verbatim_verified: true
  tags: [law, method]

